<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>ICSN ClassroomReady – Your classroom, organized and in sync.</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f7ff;--card:#fff;--ink:#27304a;--mut:#6b7494;--blue:#cfe4ff;--yel:#fff0b3;--cor:#ffd0c8;--mint:#c9f2e0;--lav:#e1d8ff;--bd:#e3e8f7;--g:#38b27a;--b:#4a9df8;--y:#f0b92b;--r:#ef5a50;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#171b2e;--card:#232842;--ink:#eef1ff;--mut:#9aa3c7;--blue:#2c4a78;--yel:#6b5a1f;--cor:#74413f;--mint:#215a47;--lav:#4a3f7a;--bd:#343b5e}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,ui-rounded,"Segoe UI",system-ui,sans-serif;font-weight:700}
.hd{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:12px 20px;background:var(--card);border-bottom:2px solid var(--bd);position:sticky;top:env(safe-area-inset-top,0px);z-index:4}
.logo{font-size:1.5rem;font-weight:900;display:flex;gap:8px;align-items:center}.logo span.w{color:var(--b)}.lg{background:var(--yel);border-radius:14px;padding:2px 8px}
nav{display:flex;gap:6px;flex-wrap:wrap}main{padding:18px 20px;max-width:1500px;margin:auto}
.btn{border:0;border-radius:18px;padding:11px 16px;font:inherit;font-weight:800;background:var(--blue);color:var(--ink);cursor:pointer;transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-2px);box-shadow:0 4px 0 rgba(0,0,0,.08)}.btn.on{outline:3px solid var(--b)}.btn.sm{padding:7px 12px;border-radius:14px}.btn.lg{padding:14px 24px;font-size:1.15rem}
.pri{background:var(--b);color:#fff}.nv.on{background:var(--yel)}
.card{background:var(--card);border-radius:28px;padding:18px;border:2px solid var(--bd);box-shadow:0 5px 0 rgba(0,0,0,.04);animation:pop .3s}
.lbl{font-weight:900;color:var(--mut);margin-bottom:8px;display:flex;justify-content:space-between;gap:8px}
.g{display:grid;gap:16px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(auto-fit,minmax(290px,1fr));align-items:start}.home{grid-template-columns:1.4fr 1fr}
@media(max-width:900px){.g2,.home{grid-template-columns:1fr}}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.big{font-size:clamp(4rem,11vw,8.5rem);font-weight:900;line-height:1;text-align:center;font-variant-numeric:tabular-nums}
.bar{height:14px;background:var(--bd);border-radius:9px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--b);border-radius:9px;transition:width .25s}
.timer.warn .big{color:var(--r);animation:pulse 1s infinite}.timer.warn .bar i{background:var(--r)}
.inp{border:2px solid var(--bd);background:var(--bg);color:var(--ink);border-radius:14px;padding:9px 12px;font:inherit;font-weight:700;min-width:0;width:100%}.row .inp{flex:1}
.lv{border-radius:20px;padding:10px;text-align:center;font-size:1.3rem;color:#fff;font-weight:900}.em{font-size:1.6rem}
.segs{display:flex;gap:6px;margin-top:8px}.segs i{flex:1;height:12px;border-radius:8px}
.mic{font-size:.85rem}.mic.live{color:var(--g)}.note{color:var(--mut);font-size:.85rem;margin-top:6px}
.c-blue{background:var(--blue)}.c-yel{background:var(--yel)}.c-cor{background:var(--cor)}.c-mint{background:var(--mint)}.c-lav{background:var(--lav)}
.tools{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}.tool{border:0;border-radius:26px;padding:18px 10px;font:inherit;font-weight:900;font-size:1.05rem;color:var(--ink);cursor:pointer;transition:transform .2s}.tool:hover{transform:scale(1.04) rotate(-1deg)}.tool b{display:block;font-size:2.4rem}
.tl{display:flex;flex-direction:column;gap:8px;align-items:center}.tl i{width:56px;height:56px;border-radius:50%;opacity:.2;cursor:pointer;transition:.2s;display:block;border:0}.tl i.on{opacity:1;box-shadow:0 0 28px currentColor}
.tlh{display:flex;gap:12px;align-items:center}
.gc{border-radius:24px;padding:14px}.gc h3{margin:0;display:flex;justify-content:space-between;align-items:center}.chip{display:inline-flex;gap:4px;align-items:center;background:var(--card);border:2px solid transparent;border-radius:14px;padding:5px 10px;margin:3px;cursor:pointer}.chip.sel{border-color:var(--ink)}.rb{border:0;background:var(--yel);border-radius:10px;font-size:.8rem;cursor:pointer;color:var(--ink)}
.task{display:flex;gap:8px;align-items:center;padding:6px 0;cursor:pointer}.task.d span{text-decoration:line-through;opacity:.5}.task input{width:22px;height:22px}
.ov{position:fixed;inset:0;background:rgba(20,25,50,.6);display:grid;place-items:center;z-index:20}.ovb{background:var(--card);border-radius:40px;padding:5vh 6vw;text-align:center;max-width:90vw;animation:pop .3s}.ovb .t{font-size:clamp(2rem,7vw,5rem);font-weight:900}.pn.win{color:var(--b);animation:pop .4s}
.disp{position:fixed;inset:0;z-index:10;display:grid;grid-template-rows:auto 1fr auto auto auto;gap:1.5vh;padding:2vh 2vw;background:var(--bg);overflow:hidden}
.dtop{display:flex;justify-content:space-between;align-items:center;font-size:2.6vh}.dtop .logo{font-size:3.4vh}
.dmain{display:grid;grid-template-columns:1.5fr 1fr;gap:2vw;min-height:0}.dL,.dR{display:grid;gap:1.5vh;min-height:0;align-content:start}
.disp .big{font-size:min(24vh,14vw)}.disp .card{padding:2vh 1.5vw;border-radius:3vh}.disp h2{margin:0;font-size:4vh}.disp .tx{font-size:3vh}
.dg{display:flex;gap:1vw}.dg .gc{flex:1;font-size:2.2vh}.pts{font-size:4vh}
.ft{text-align:center;color:var(--mut);font-size:1.8vh}
.fl{animation:pulse 1s infinite}
.pw{position:relative;min-width:0;min-height:0}.fb{position:absolute;top:1.2vh;right:1.2vh;opacity:.45;z-index:2}.fb:hover{opacity:1}
.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:18px;align-items:start}.hc{position:relative}.hc.wide{grid-column:1/-1}.hx{position:absolute;top:-8px;right:-8px;z-index:2;border-radius:50%;padding:4px 9px}
.bar2{position:sticky;bottom:env(safe-area-inset-bottom,0px);margin-top:18px;background:var(--card);border:2px solid var(--bd);border-radius:24px;padding:10px 14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;box-shadow:0 -4px 20px rgba(0,0,0,.08);z-index:3}.bar2 .sp{flex:1}.bar2 .tools{display:flex;flex-wrap:wrap;gap:6px}.bar2 .tool{padding:6px 10px;font-size:.85rem;border-radius:14px;display:inline-flex;gap:4px;align-items:center}.bar2 .tool b{display:inline;font-size:1.2rem}
.dock{flex-wrap:wrap}.cmwrap{position:fixed;right:2vw;bottom:12vh;z-index:15}.cmenu{display:flex;gap:1vh;flex-wrap:wrap;align-items:center;max-width:62vw;padding:1.5vh 2vh!important;box-shadow:0 1vh 4vh rgba(0,0,0,.25)}
.stage>.pw{transition:left .35s,top .35s,width .35s,height .35s}.stage>.pw[style*="z-index"]{transition:none}.pw.tgt{border:.7vh solid var(--y)!important}
.ctl{position:absolute;top:1.2vh;right:1.2vh;display:flex;gap:.6vh;opacity:.5;z-index:5}.ctl:hover{opacity:1}.ctl .btn{padding:.5vh 1.2vh;font-size:2.4vh;border-radius:1.4vh}
.disp{grid-template-rows:auto 1fr auto auto}.stage{position:relative;min-height:0}.stage>.pw{position:absolute;overflow:hidden;border:.7vh solid transparent;border-radius:3vh}.arr .stage>.pw{border:.7vh dashed var(--b)}.arr .pi{pointer-events:none}
.pi{position:absolute;left:0;top:0;transform-origin:0 0;display:flex}.pi>.card,.pi>.dg{flex:1;display:flex;flex-direction:column;justify-content:center;min-width:0}
.pi .card{padding:28px;border-radius:40px}.pi .big{font-size:230px}.pi h2{font-size:64px}.pi .tx{font-size:40px}.pi .lbl{font-size:28px}.pi .lv{font-size:54px;padding:22px}.pi .em{font-size:60px}.pi .segs i,.pi .bar{height:22px}.pi .tlh{justify-content:center;gap:40px}.pi .tlh i{width:150px!important;height:150px!important}.pi .dg{flex-direction:row;flex-wrap:wrap;gap:20px}.pi .gc{font-size:34px;flex:1 1 300px}.pi .pts{font-size:48px}.pi .btn.sm{font-size:28px;padding:10px 18px}.pi .task input{width:34px;height:34px}.pi .chip{font-size:30px;padding:6px 14px}.pi .rb{font-size:26px}
.mv{position:absolute;inset:0;cursor:move;background:rgba(74,157,248,.12);z-index:3;touch-action:none}.mv span{display:inline-block;margin:1vh;padding:.6vh 1.2vh;border-radius:1.5vh;background:var(--b);color:#fff;font-size:2vh}.rs{position:absolute;right:0;bottom:0;width:4.5vh;height:4.5vh;cursor:nwse-resize;background:var(--b);border-radius:1.5vh 0 0 0;z-index:4;touch-action:none}
main .timer{padding:14px}main .timer .big{font-size:clamp(3.2rem,7vw,5.5rem)}main .timer .row{margin-top:6px;gap:6px}main .timer .bar{margin:4px 0}main .timer .lbl{margin-bottom:2px}main .timer .btn.lg{padding:10px 18px;font-size:1.05rem}
.dL{grid-template-rows:1fr auto;align-content:stretch}.dL .pw:first-child,.dL .pw:first-child .card{height:100%}.dL .pw:first-child .card{display:flex;flex-direction:column;justify-content:center}.dL .big{font-size:min(30vh,15vw)}
.dock{display:flex;gap:.8vw;justify-content:center}.dk{font-size:2vh;padding:1vh 1.1vw;white-space:nowrap;border-radius:2vh}.dk b{font-size:2.6vh}
.dmain.focus{grid-template-columns:1fr}.dfocus,.dfocus .pw{height:100%}.dfocus .card,.dfocus .dg{height:100%;display:flex;flex-direction:column;justify-content:center}
.dfocus .big{font-size:min(48vh,26vw)}.dfocus .lv{font-size:10vh;padding:5vh}.dfocus .em{font-size:12vh}.dfocus .segs i,.dfocus .bar{height:4vh}.dfocus .lbl{font-size:3vh}.dfocus h2{font-size:11vh}.dfocus .tx{font-size:5vh}.dfocus .tlh{justify-content:center;gap:4vw}.dfocus .tlh i{width:26vh!important;height:26vh!important}.dfocus .gc{font-size:4.5vh}.dfocus .pts{font-size:7vh}
.strip{display:flex;gap:1vw;max-height:24vh}.strip .pw{flex:1;overflow:hidden}.strip .card{padding:1vh 1vw;height:100%}.strip .big{font-size:9vh}.strip .lv{font-size:2.6vh;padding:.8vh}.strip .em{font-size:3vh}.strip .segs,.strip .lbl,.strip .tlh .tx{display:none}.strip h2{font-size:3vh}.strip .tx{font-size:1.8vh}.strip .tlh i{width:6vh!important;height:6vh!important}.strip .dg{font-size:1.6vh}.strip .pts{font-size:2.4vh}
@keyframes pop{from{transform:scale(.94);opacity:.4}to{transform:none;opacity:1}}@keyframes pulse{50%{transform:scale(1.05)}}
</style></head><body><div id="app"></div><div id="ov"></div>
<script>
const $=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,8),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const NAMES=['Mia','Leo','Ava','Noah','Zoe','Eli','Lily','Max','Ivy','Sam','Ruby','Finn','Nora','Jack','Cleo','Owen','Maya','Theo'];
const DEF={classes:[{id:'c1',name:'Class 3A',students:NAMES.map(n=>({id:uid(),n}))}],cur:'c1',teacher:'Ms. Rivera',sound:true,thresh:60,voice:'whisper',light:'green',mode:'plenary',gm:'count',gn:4,groups:[],activity:{title:'Math Story Problems',text:'Read the problem together, then solve it with your team.',tasks:[{t:'Read the problem',d:false},{t:'Draw a picture',d:false},{t:'Share your answer',d:false}]}};
let S;try{S=JSON.parse(localStorage.getItem('cr')||'')}catch(x){}S=Object.assign(structuredClone(DEF),S||{});
const save=()=>{try{localStorage.setItem('cr',JSON.stringify(S))}catch(x){}};
const R={s:'home',v:'teacher',t:{total:300,left:300,run:false,end:0},n:{on:false,lvl:0,err:'',man:null},ov:null,sel:null};
const cls=()=>S.classes.find(c=>c.id===S.cur)||S.classes[0],stu=()=>cls().students;
const VOICE={whisper:['Whisper','🤫','Whisper voices only','--blue'],quiet:['Quiet Discussion','🙂','Inside voices with your team','--mint'],group:['Group Discussion','💬','Table voices, stay on task','--yel']};
const LV=[['Quiet','--g','😌'],['Whisper','--b','🤫'],['Group Discussion','--y','💬'],['Too Loud','--r','📢']];
const LIGHT={green:['Green','Ready and working','--g'],yellow:['Yellow','Check your voice and behavior','--y'],red:['Red','Stop, pause and listen','--r']};
const ROLES=[['Leader','👑'],['Recorder','✏️'],['Reporter','🎤'],['Timekeeper','⏰'],['Materials Manager','📦']];
const GN=['Sunshine','Rockets','Dolphins','Rainbows','Owls','Pandas','Comets','Tigers','Stars','Turtles'],COL=['blue','yel','cor','mint','lav'];
const BREAKS=['🙆 Stretch up high like a tall tree!','🕺 Dance for 20 seconds!','🌬️ Take 5 slow dragon breaths.','🦘 Jump like a kangaroo 10 times!','🐢 Move in slow motion like a turtle.','🙌 High-five three friends quietly!'];
const fmt=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
const tl=()=>R.t.run?Math.max(0,Math.ceil((R.t.end-Date.now())/1000)):R.t.left;
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
/* audio */
let AC;const snd=a=>{try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();AC.resume();a.forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+i*.18;o.frequency.value=f;g.gain.setValueAtTime(.25,t);g.gain.exponentialRampToValueAtTime(.001,t+1.1);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+1.2)})}catch(x){}};
const show=(o,ms)=>{R.ov=o;clearTimeout(R.ot);if(ms)R.ot=setTimeout(()=>{R.ov=null;render()},ms);render()};
/* mic */
const lvl=()=>R.n.on?(R.n.lvl<12?0:R.n.lvl<32?1:R.n.lvl<S.thresh?2:3):(R.n.man??0);
async function mic(){if(R.n.on){stopMic();render();return}
 try{const st=await navigator.mediaDevices.getUserMedia({audio:true}),c=new(window.AudioContext||window.webkitAudioContext)(),an=c.createAnalyser();an.fftSize=1024;c.createMediaStreamSource(st).connect(an);const buf=new Uint8Array(an.fftSize);R.n={on:true,lvl:0,err:'',man:null,st,c};
  R.nt=setInterval(()=>{const p=lvl();an.getByteTimeDomainData(buf);let s=0;for(const v of buf){const x=(v-128)/128;s+=x*x}const db=20*Math.log10(Math.sqrt(s/buf.length)+1e-4);R.n.lvl=R.n.lvl*.7+Math.max(0,Math.min(100,(db+60)*2))*.3;
   if(lvl()!==p)render();else document.querySelectorAll('[data-nzf]').forEach(x=>x.style.width=R.n.lvl+'%')},120);render()}
 catch(x){R.n={on:false,lvl:0,err:'Microphone isn’t available here. Use the manual buttons instead.',man:R.n.man};render()}}
function stopMic(){clearInterval(R.nt);try{R.n.st.getTracks().forEach(t=>t.stop());R.n.c.close()}catch(x){}R.n={on:false,lvl:0,err:'',man:null}}
/* components */
const timerCard=()=>`<div class="card timer"><div class="lbl">⏱️ Countdown</div><div class="big" data-t></div><div class="bar"><i data-bar></i></div>
<div class="row">${[1,3,5,10,15,20].map(m=>`<button class="btn sm ${R.t.total==m*60?'on':''}" data-a="setT" data-v="${m*60}">${m} min</button>`).join('')}</div>
<div class="row"><input id="cust" type="number" min="1" max="180" placeholder="Custom minutes" class="inp"><button class="btn sm" data-a="cust">Set</button></div>
<div class="row">${R.t.run?'<button class="btn pri lg" data-a="pause">⏸ Pause</button>':`<button class="btn pri lg" data-a="start">▶ ${R.t.left<R.t.total&&R.t.left>0?'Resume':'Start'}</button>`}<button class="btn lg" data-a="reset">↺ Reset</button></div></div>`;
const noiseCard=ctl=>{const i=lvl(),L=LV[i];return `<div class="card"><div class="lbl">🔊 Noise meter <span class="mic ${R.n.on?'live':''}">${R.n.on?'● Mic listening':'○ Mic off'}</span></div>
<div class="lv" style="background:var(${L[1]})"><span class="em">${L[2]}</span> ${L[0]}</div>
<div class="segs">${LV.map((l,j)=>`<i style="background:var(${l[1]});opacity:${j==i?1:.25}"></i>`).join('')}</div>
<div class="bar"><i data-nzf style="width:${R.n.on?R.n.lvl:(i+1)*25}%;background:var(${L[1]})"></i></div>
${ctl?`<div class="row"><button class="btn sm ${R.n.on?'on':''}" data-a="mic">${R.n.on?'⏹ Stop microphone':'🎤 Turn on microphone'}</button></div>
${R.n.on?'':`<div class="note">${R.n.err||'Mic is off. Set the level by hand:'}</div><div class="row">${LV.map((l,j)=>`<button class="btn sm ${R.n.man==j?'on':''}" data-a="man" data-v="${j}">${l[2]}</button>`).join('')}</div>`}
<div class="note">Too loud above: <input type="range" min="40" max="90" value="${S.thresh}" data-i="thresh"> ${S.thresh}</div><div class="note">Sound is analysed in your browser only, never recorded.</div>`:''}</div>`};
const voiceCard=ctl=>{const V=VOICE[S.voice];return ctl?`<div class="card"><div class="lbl">🗣️ Voice level</div><div class="row">${Object.entries(VOICE).map(([k,v])=>`<button class="btn ${S.voice==k?'on':''}" style="background:var(${v[3]})" data-a="voice" data-v="${k}">${v[1]} ${v[0]}</button>`).join('')}</div><div class="note">${V[2]}</div></div>`
:`<div class="card" style="background:var(${V[3]})"><div class="lbl">Voice level</div><h2>${V[1]} ${V[0]}</h2><div class="tx">${V[2]}</div></div>`};
const lightCard=ctl=>ctl?`<div class="card"><div class="lbl">🚦 Traffic light</div><div class="tlh"><div class="tl">${Object.entries(LIGHT).reverse().map(([k,v])=>`<i class="${S.light==k?'on':''}" style="background:var(${v[2]});color:var(${v[2]})" data-a="light" data-v="${k}"></i>`).join('')}</div><div><h2 style="margin:0;color:var(${LIGHT[S.light][2]})">${LIGHT[S.light][0]}</h2>${LIGHT[S.light][1]}</div></div></div>`
:`<div class="card"><div class="tlh">${Object.entries(LIGHT).map(([k,v])=>`<i style="width:9vh;height:9vh;border-radius:50%;background:var(${v[2]});color:var(${v[2]});opacity:${S.light==k?1:.15};box-shadow:${S.light==k?'0 0 4vh currentColor':'none'}"></i>`).join('')}<div class="tx"><b style="color:var(${LIGHT[S.light][2]})">${LIGHT[S.light][0]}</b><br>${LIGHT[S.light][1]}</div></div></div>`;
const tasks=ctl=>S.activity.tasks.map((k,i)=>`<div class="task ${k.d?'d':''}" ${ctl?`data-a="task" data-v="${i}"`:''}><input type="checkbox" ${k.d?'checked':''} ${ctl?'':'disabled'}><span>${esc(k.t)}</span>${ctl==1?`<button class="btn sm" data-a="rmtask" data-v="${i}">✕</button>`:''}</div>`).join('');
const actCard=ctl=>ctl?`<div class="card c-lav"><div class="lbl">📝 Activity &amp; instructions</div><input class="inp" value="${esc(S.activity.title)}" data-i="atitle"><textarea class="inp" rows="2" style="margin-top:8px" data-i="atext">${esc(S.activity.text)}</textarea><div class="lbl" style="margin-top:12px">✅ Task checklist</div>${tasks(1)}<input class="inp" placeholder="Add a task and press Enter" data-i="addtask"></div>`
:`<div class="card c-lav"><div class="lbl">Our activity</div><h2>${esc(S.activity.title)}</h2><div class="tx">${esc(S.activity.text)}</div><div class="tx">${tasks(2)}</div></div>`;
const attCard=()=>`<div class="card c-cor"><div class="lbl">🔔 Attention signal</div><div class="row">${[['bell','🔔 Bell'],['chime','🎵 Chime'],['count','5‑4‑3‑2‑1'],['freeze','🧊 Freeze!'],['eyes','👀 Eyes on me!']].map(a=>`<button class="btn" data-a="sig" data-v="${a[0]}">${a[1]}</button>`).join('')}</div></div>`;
